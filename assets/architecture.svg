<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <linearGradient id="archGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#00f5ff" />
      <stop offset="0.5" stop-color="#008cff" />
      <stop offset="1" stop-color="#b300ff" />
    </linearGradient>
    <filter id="gl" ><feGaussianBlur stdDeviation="8" /></filter>
  </defs>
  <rect width="100%" height="100%" fill="#05121a" rx="8" />

  <!-- nodes -->
  <g stroke="url(#archGrad)" stroke-width="2" fill="#021018">
    <circle cx="160" cy="120" r="28" />
    <circle cx="420" cy="80" r="26" />
    <circle cx="660" cy="160" r="30" />
    <circle cx="360" cy="260" r="24" />
  </g>

  <!-- connections -->
  <g stroke="url(#archGrad)" stroke-width="1.8" fill="none">
    <path d="M188 120 C260 120, 340 100, 392 92" />
    <path d="M448 92 C520 80, 620 120, 640 150" />
    <path d="M388 106 C420 150, 380 220, 360 246" />
  </g>

  <!-- labels -->
  <g font-family="Inter, Roboto, sans-serif" font-size="13" fill="#9fb6c9">
    <text x="120" y="165">User Input</text>
    <text x="380" y="60">Intent Router</text>
    <text x="620" y="200">Vector DB</text>
    <text x="320" y="290">Orchestrator</text>
  </g>

  <!-- floating particles -->
  <g fill="#00f5ff" opacity="0.08">
    <circle cx="40" cy="40" r="4"><animate attributeName="cy" values="40;48;40" dur="5s" repeatCount="indefinite" /></circle>
    <circle cx="860" cy="30" r="6"><animate attributeName="cy" values="30;20;30" dur="6s" repeatCount="indefinite" /></circle>
  </g>

  <!-- animated glow under nodes -->
  <g>
    <ellipse cx="160" cy="156" rx="44" ry="12" fill="url(#archGrad)" opacity="0.06" filter="url(#gl)" />
    <ellipse cx="420" cy="146" rx="40" ry="10" fill="url(#archGrad)" opacity="0.06" filter="url(#gl)" />
    <ellipse cx="660" cy="196" rx="48" ry="12" fill="url(#archGrad)" opacity="0.06" filter="url(#gl)" />
  </g>
</svg>
