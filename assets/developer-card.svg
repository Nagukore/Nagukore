<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="540" height="320" viewBox="0 0 540 320">
  <defs>
    <linearGradient id="cardGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0.18" />
      <stop offset="0.5" stop-color="#008cff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#b300ff" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="edgeGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#00f5ff" />
      <stop offset="1" stop-color="#b300ff" />
    </linearGradient>
    <filter id="cardBlur"><feGaussianBlur stdDeviation="8" result="b"/></filter>
  </defs>

  <rect width="100%" height="100%" rx="18" fill="#041018" />

  <!-- glass panel -->
  <rect x="12" y="12" width="516" height="296" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" />

  <!-- neon edge -->
  <rect x="6" y="6" width="528" height="308" rx="18" fill="none" stroke="url(#edgeGlow)" stroke-width="1" opacity="0.7" filter="url(#cardBlur)" />

  <!-- avatar circle -->
  <g transform="translate(30,40)">
    <circle cx="60" cy="60" r="48" fill="url(#cardGrad)" stroke="#06232e" stroke-width="2" />
    <circle cx="60" cy="60" r="26" fill="#06121a" stroke="url(#edgeGlow)" stroke-width="1.2" opacity="0.9" />
    <text x="60" y="68" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="22" fill="#9ed6ff">NK</text>
  </g>

  <!-- developer badges -->
  <g transform="translate(140,36)" font-family="Inter, Roboto, sans-serif">
    <text x="0" y="18" font-size="18" fill="#ffffff">Nagesh Kore</text>
    <text x="0" y="40" font-size="13" fill="#9fb6c9">AI Engineer · Full‑Stack Systems</text>

    <g transform="translate(0,64)">
      <rect x="0" y="0" width="380" height="28" rx="6" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.02)" />
      <text x="12" y="18" font-size="12" fill="#9ed6ff">• Retrieval-First RAG</text>
      <text x="180" y="18" font-size="12" fill="#9ed6ff">• Realtime Orchestration</text>
    </g>

    <g transform="translate(0,108)">
      <rect x="0" y="0" width="380" height="26" rx="6" fill="rgba(255,255,255,0.01)" />
      <text x="12" y="17" font-size="12" fill="#a6e6ff">Bangalore, India — nagesh.amcec@gmail.com</text>
    </g>
  </g>

  <!-- subtle particles -->
  <g fill="#00f5ff" opacity="0.08">
    <circle cx="460" cy="46" r="5">
      <animate attributeName="r" values="5;7;5" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="220" r="6">
      <animate attributeName="cy" values="220;200;220" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

</svg>
