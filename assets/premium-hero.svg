<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Hero banner: Nagesh Kore — AI Engineer and Full Stack Developer">
  <title>Nagesh Kore — AI Engineer & Full Stack Developer</title>
  <desc>Premium SVG hero banner with animated neural-network background, circuit lines, floating particles, code panel and glowing borders. Includes links to GitHub, LinkedIn and Portfolio.</desc>
  <defs>
    <!-- Palette -->
    <linearGradient id="palA" x1="0" x2="1">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#008cff" />
      <stop offset="100%" stop-color="#b300ff" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061018" />
      <stop offset="100%" stop-color="#040613" />
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#008cff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#b300ff" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- animated stroke gradient for circuits -->
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#008cff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#b300ff" stop-opacity="0.9" />
    </linearGradient>

    <!-- pattern for subtle code lines -->
    <pattern id="codeLines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="transparent" />
      <path d="M0 6 H8" stroke="#04202a" stroke-width="1" opacity="0.18" />
    </pattern>

    <!-- glow for buttons -->
    <linearGradient id="btnGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#8a3bff" />
    </linearGradient>

  </defs>

  <!-- background base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- animated circuit lines group -->
  <g id="circuits" stroke="url(#strokeGrad)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.9" filter="url(#softGlow)">
    <path d="M80 360 C220 280, 360 420, 520 360" stroke-opacity="0.24">
      <animate attributeName="stroke-dashoffset" values="0;300" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M540 120 C700 60, 860 220, 1020 120" stroke-opacity="0.22">
      <animate attributeName="stroke-dashoffset" values="0;-320" dur="10s" repeatCount="indefinite" />
    </path>
    <path d="M1120 380 C1260 320, 1400 420, 1520 360" stroke-opacity="0.2">
      <animate attributeName="stroke-dashoffset" values="0;260" dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- neural nodes network -->
  <g id="nodes">
    <!-- lines connecting nodes -->
    <g stroke="#0c5f78" stroke-opacity="0.12" stroke-width="1">
      <line x1="260" y1="160" x2="420" y2="110" />
      <line x1="420" y1="110" x2="640" y2="150" />
      <line x1="640" y1="150" x2="900" y2="120" />
      <line x1="900" y1="120" x2="1160" y2="160" />
    </g>

    <!-- animated nodes -->
    <g>
      <g transform="translate(260,160)">
        <circle r="10" fill="url(#nodeGlow)" />
        <circle r="3" fill="#ffffff">
          <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite" />
        </circle>
      </g>

      <g transform="translate(420,110)">
        <circle r="12" fill="url(#nodeGlow)" />
        <circle r="4" fill="#fff">
          <animate attributeName="r" values="3;5;3" dur="3.4s" repeatCount="indefinite" />
        </circle>
      </g>

      <g transform="translate(640,150)">
        <circle r="9" fill="url(#nodeGlow)" />
        <circle r="3" fill="#fff">
          <animate attributeName="r" values="2;4;2" dur="2.8s" repeatCount="indefinite" />
        </circle>
      </g>

      <g transform="translate(900,120)">
        <circle r="14" fill="url(#nodeGlow)" />
        <circle r="5" fill="#fff">
          <animate attributeName="r" values="3;6;3" dur="3.8s" repeatCount="indefinite" />
        </circle>
      </g>

      <g transform="translate(1160,160)">
        <circle r="8" fill="url(#nodeGlow)" />
        <circle r="3" fill="#fff">
          <animate attributeName="r" values="2;4;2" dur="3.2s" repeatCount="indefinite" />
        </circle>
      </g>
    </g>
  </g>

  <!-- floating particles field (subtle) -->
  <g id="particles" fill="#00f5ff" opacity="0.12">
    <circle cx="120" cy="40" r="3">
      <animate attributeName="cy" values="40;20;40" dur="7s" repeatCount="indefinite" />
      <animate attributeName="cx" values="120;140;120" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="360" cy="80" r="4">
      <animate attributeName="cy" values="80;60;80" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="760" cy="36" r="5">
      <animate attributeName="cy" values="36;16;36" dur="11s" repeatCount="indefinite" />
    </circle>
    <circle cx="1220" cy="58" r="3">
      <animate attributeName="cx" values="1220;1240;1220" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1400" cy="30" r="4">
      <animate attributeName="cy" values="30;10;30" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- code panel (left) -->
  <g transform="translate(60,220)" font-family="monospace" fill="#9ed6ff" opacity="0.95">
    <rect x="0" y="0" width="520" height="210" rx="12" fill="rgba(0,0,0,0.45)" stroke="rgba(255,255,255,0.04)" />
    <rect x="12" y="12" width="496" height="186" rx="8" fill="url(#codeLines)" />

    <g transform="translate(22,34)" font-size="13">
      <text x="0" y="0">// runtime: ai-pipeline</text>
      <text x="0" y="22">const router = new IntentRouter();</text>
      <text x="0" y="44">router.on('KNOWLEDGE', async (req) =&gt; {</text>
      <text x="16" y="66">const docs = await retriever.search(req.q);</text>
      <text x="16" y="88">return llm.generate({ context: docs });</text>
      <text x="0" y="110">});</text>

      <!-- blinking cursor -->
      <rect x="210" y="108" width="8" height="14" fill="#00f5ff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- glowing borders and frame -->
  <g filter="url(#strongGlow)">
    <rect x="8" y="8" width="1584" height="504" rx="18" fill="none" stroke="url(#palA)" stroke-width="2" opacity="0.08"/>
  </g>

  <!-- Text area (right) -->
  <g transform="translate(620,120)" font-family="Inter, Roboto, -apple-system, sans-serif" fill="#fff">
    <text x="0" y="0" font-size="48" font-weight="700" fill="#ffffff">Nagesh Kore</text>
    <text x="0" y="56" font-size="22" fill="#9fb6c9">AI Engineer</text>
    <text x="0" y="90" font-size="22" fill="#9fb6c9">Full Stack Developer</text>

    <text x="0" y="140" font-size="20" fill="#9ed6ff">Building Production AI Systems</text>

    <!-- buttons -->
    <g transform="translate(0,172)">
      <a xlink:href="https://github.com/Nagukore">
        <g>
          <rect x="0" y="0" width="140" height="40" rx="8" fill="#021018" stroke="url(#btnGrad)" />
          <text x="20" y="26" font-size="14" fill="#a6e6ff">GitHub</text>
        </g>
      </a>

      <a xlink:href="https://www.linkedin.com/in/nagesh-kore-7566b6254">
        <g transform="translate(160,0)">
          <rect x="0" y="0" width="160" height="40" rx="8" fill="#021018" stroke="url(#btnGrad)" />
          <text x="18" y="26" font-size="14" fill="#a6e6ff">LinkedIn</text>
        </g>
      </a>

      <a xlink:href="https://nageshs.vercel.app/">
        <g transform="translate(340,0)">
          <rect x="0" y="0" width="160" height="40" rx="8" fill="#021018" stroke="url(#btnGrad)" />
          <text x="18" y="26" font-size="14" fill="#a6e6ff">Portfolio</text>
        </g>
      </a>
    </g>
  </g>

  <!-- subtle foreground circuit overlay for depth -->
  <g stroke="url(#strokeGrad)" stroke-opacity="0.06" stroke-width="2" fill="none">
    <path d="M580 360 C720 320, 840 420, 980 360" />
  </g>

</svg>
