<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160">
  <defs>
    <linearGradient id="tGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#00f5ff" />
      <stop offset="1" stop-color="#b300ff" />
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="100%" height="100%" fill="#05121a"/>

  <!-- timeline line -->
  <line x1="40" y1="80" x2="960" y2="80" stroke="#07202a" stroke-width="6" />
  <g stroke="url(#tGrad)" stroke-width="3" fill="none">
    <circle cx="80" cy="80" r="12" fill="#021018" stroke="url(#tGrad)" />
    <circle cx="260" cy="80" r="10" fill="#021018" />
    <circle cx="420" cy="80" r="12" fill="#021018" />
    <circle cx="620" cy="80" r="10" fill="#021018" />
    <circle cx="820" cy="80" r="12" fill="#021018" />
  </g>

  <g font-family="Inter, Roboto, sans-serif" font-size="12" fill="#9fb6c9">
    <text x="60" y="112">2023 — Client Delivery</text>
    <text x="240" y="112">2024 — Local RAG Prototypes</text>
    <text x="400" y="112">2025 — FOSYS (IC‑AISMART)</text>
    <text x="600" y="112">2025 — Research Publication</text>
    <text x="800" y="112">2026 — Local LLM & Orchestration</text>
  </g>

  <!-- moving marker -->
  <g>
    <circle cx="80" cy="80" r="6" fill="#00f5ff">
      <animate attributeName="cx" values="80;260;420;620;820;80" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80;80;80;80;80;80" dur="14s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="80" r="20" fill="none" stroke="url(#tGrad)" stroke-opacity="0.25">
      <animate attributeName="cx" values="80;260;420;620;820;80" dur="14s" repeatCount="indefinite" />
      <animate attributeName="r" values="20;26;20" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
