<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" role="img" aria-label="Developer ID card for Nagesh Kore">
  <title>Developer ID — Nagesh Kore</title>
  <desc>Glassmorphism developer badge with photo placeholder, role, company, location, tech list and swinging animation.</desc>
  <defs>
    <linearGradient id="gradMain" x1="0" x2="1">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#008cff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#b300ff" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cardBG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.02)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)" />
    </linearGradient>

    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="g" />
      <feMerge>
        <feMergeNode in="g" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="420" height="280" rx="20" ry="20" />
    </clipPath>
  </defs>

  <!-- background subtle -->
  <rect width="100%" height="100%" fill="#060b10" />

  <!-- card group with swing animation centered at top middle -->
  <g transform="translate(210,40)" >
    <g transform="translate(-210,0)" style="transform-origin:210px 0px;">

      <!-- swing animation applied to whole card -->
      <g id="card" transform="translate(0,0)">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="4s"
          values="-6 210 20;6 210 20;-6 210 20" repeatCount="indefinite"/>

        <!-- glass card body -->
        <rect x="12" y="12" width="396" height="240" rx="16" ry="16" fill="rgba(255,255,255,0.03)" stroke="url(#gradMain)" stroke-opacity="0.08" />

        <!-- inner frosted panel -->
        <rect x="22" y="22" width="376" height="220" rx="12" ry="12" fill="url(#cardBG)" stroke="rgba(255,255,255,0.03)" />

        <!-- photo placeholder -->
        <g transform="translate(36,36)">
          <rect width="100" height="110" rx="10" fill="#021018" stroke="url(#gradMain)" stroke-width="1.2" />
          <circle cx="50" cy="50" r="28" fill="#03131a" stroke="#083447" />
          <text x="50" y="56" font-family="Inter, Roboto, -apple-system, sans-serif" font-size="20" fill="#9ed6ff" text-anchor="middle">NK</text>
          <text x="50" y="90" font-family="Inter, Roboto, -apple-system, sans-serif" font-size="10" fill="#7fbfdc" text-anchor="middle">Photo</text>
        </g>

        <!-- name and role -->
        <g transform="translate(150,36)" font-family="Inter, Roboto, -apple-system, sans-serif">
          <text x="0" y="18" font-size="20" fill="#ffffff" font-weight="700">Nagesh Kore</text>
          <text x="0" y="42" font-size="12" fill="#9fb6c9">AI Engineer</text>
          <text x="0" y="62" font-size="11" fill="#9ed6ff">ThoughtsCrest</text>
          <text x="0" y="78" font-size="11" fill="#9fb6c9">Bangalore</text>
        </g>

        <!-- divider line -->
        <line x1="34" y1="146" x2="386" y2="146" stroke="#07232a" stroke-width="1" />

        <!-- tech badges -->
        <g transform="translate(36,156)" font-family="Inter, Roboto, -apple-system, sans-serif">
          <!-- each pill -->
          <g>
            <rect x="0" y="0" width="84" height="26" rx="8" fill="#021018" stroke="url(#gradMain)" />
            <text x="12" y="17" font-size="11" fill="#9ed6ff">Python</text>
          </g>
          <g transform="translate(96,0)">
            <rect x="0" y="0" width="64" height="26" rx="8" fill="#021018" stroke="url(#gradMain)" />
            <text x="12" y="17" font-size="11" fill="#9ed6ff">React</text>
          </g>
          <g transform="translate(168,0)">
            <rect x="0" y="0" width="84" height="26" rx="8" fill="#021018" stroke="url(#gradMain)" />
            <text x="12" y="17" font-size="11" fill="#9ed6ff">FastAPI</text>
          </g>
          <g transform="translate(258,0)">
            <rect x="0" y="0" width="88" height="26" rx="8" fill="#021018" stroke="url(#gradMain)" />
            <text x="12" y="17" font-size="11" fill="#9ed6ff">LangChain</text>
          </g>
        </g>

        <g transform="translate(36,192)" font-family="Inter, Roboto, -apple-system, sans-serif">
          <g>
            <rect x="0" y="0" width="90" height="26" rx="8" fill="#021018" stroke="url(#gradMain)" />
            <text x="12" y="17" font-size="11" fill="#9ed6ff">Qdrant</text>
          </g>
          <g transform="translate(108,0)">
            <rect x="0" y="0" width="78" height="26" rx="8" fill="#021018" stroke="url(#gradMain)" />
            <text x="12" y="17" font-size="11" fill="#9ed6ff">Ollama</text>
          </g>
          <g transform="translate(198,0)">
            <rect x="0" y="0" width="78" height="26" rx="8" fill="#021018" stroke="url(#gradMain)" />
            <text x="12" y="17" font-size="11" fill="#9ed6ff">Docker</text>
          </g>
        </g>

        <!-- status ribbon -->
        <g transform="translate(250,36)">
          <rect x="0" y="0" width="128" height="32" rx="8" fill="rgba(2,18,24,0.6)" stroke="url(#gradMain)" />
          <text x="8" y="20" font-size="12" fill="#a6e6ff">Status</text>
          <text x="8" y="36" font-size="11" fill="#9ed6ff">Currently Building AI Systems</text>
        </g>

        <!-- hanging hole and lanyard slot (visual) -->
        <g transform="translate(198,-6)">
          <rect x="0" y="-8" width="24" height="12" rx="4" fill="#021018" stroke="#062e3a"/>
        </g>

        <!-- subtle particle/glow under card -->
        <ellipse cx="210" cy="268" rx="90" ry="10" fill="url(#gradMain)" opacity="0.06" filter="url(#blurSoft)" />
      </g>
    </g>
  </g>

  <!-- small floating particles around card -->
  <g fill="#00f5ff" opacity="0.06">
    <circle cx="48" cy="36" r="3"><animate attributeName="cy" values="36;28;36" dur="6s" repeatCount="indefinite" /></circle>
    <circle cx="380" cy="68" r="4"><animate attributeName="cy" values="68;78;68" dur="7s" repeatCount="indefinite" /></circle>
  </g>
</svg>
