<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="headGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#00f5ff" />
      <stop offset="1" stop-color="#b300ff" />
    </linearGradient>
    <filter id="hblur"><feGaussianBlur stdDeviation="8" /></filter>
  </defs>
  <rect width="100%" height="100%" fill="#060b10" />

  <g transform="translate(24,22)">
    <rect x="0" y="0" width="1152" height="176" rx="12" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.02)" />

    <g transform="translate(20,18)">
      <text x="0" y="28" font-family="Inter, Roboto, sans-serif" font-size="22" fill="#ffffff">GitHub Profile</text>
      <text x="0" y="56" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#9fb6c9">A minimal, production-focused profile highlighting AI systems, realtime infra and RAG.</text>
    </g>

    <g transform="translate(900,36)">
      <rect x="0" y="0" width="212" height="120" rx="8" fill="#021018" stroke="url(#headGrad)" />
      <text x="14" y="28" font-family="Inter, Roboto, sans-serif" font-size="14" fill="#9ed6ff">Profile</text>
      <text x="14" y="54" font-size="12" fill="#9fb6c9">Followers · Repos · Activity</text>
    </g>

    <g>
      <g fill="#00f5ff" opacity="0.06">
        <circle cx="1080" cy="150" r="8"><animate attributeName="r" values="6;10;6" dur="6s" repeatCount="indefinite" /></circle>
      </g>
    </g>
  </g>
</svg>
