<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gradA" x1="0" x2="1">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#008cff" />
      <stop offset="100%" stop-color="#b300ff" />
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b300ff" stop-opacity="0.6" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#060b10" />

  <!-- animated gradient wave -->
  <g filter="url(#softGlow)">
    <path id="wave" d="M-200 260 C200 120, 500 400, 900 260 C1300 120, 1500 360, 1900 260 L1900 420 L-200 420 Z" fill="url(#gradA)">
      <animateTransform attributeName="transform" attributeType="XML" type="translate" from="0 0" to="60 0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;0.6;0.95" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- floating particles -->
  <g fill="#00f5ff" fill-opacity="0.12">
    <circle cx="220" cy="80" r="6">
      <animate attributeName="cy" values="80;60;80" dur="6s" repeatCount="indefinite" />
      <animate attributeName="cx" values="220;240;220" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="420" cy="40" r="4">
      <animate attributeName="cy" values="40;30;40" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1160" cy="120" r="5">
      <animate attributeName="cy" values="120;140;120" dur="6.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1400" cy="50" r="8">
      <animate attributeName="cy" values="50;30;50" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- monitor / workspace silhouette -->
  <g transform="translate(120,60)">
    <rect x="880" y="-10" width="520" height="320" rx="18" fill="rgba(255,255,255,0.03)" stroke="url(#gradA)" stroke-width="1.2" />
    <rect x="900" y="10" width="480" height="220" rx="10" fill="#03101a" />

    <!-- terminal window lines -->
    <g transform="translate(920,30)" fill="#9ed6ff" font-family="Inter, Roboto, -apple-system, sans-serif" font-size="14">
      <rect width="440" height="18" rx="4" fill="#05121a" opacity="0.6" />
      <text x="10" y="13" fill="#7be9ff" opacity="0.95">$ start-dev-server --ai-pipe</text>
      <rect y="28" width="440" height="18" rx="4" fill="#041018" opacity="0.45" />
      <text x="10" y="41" fill="#9ed6ff" opacity="0.85">Initializing retriever… connected to Qdrant</text>
      <rect y="56" width="440" height="18" rx="4" fill="#031014" opacity="0.35" />
      <text x="10" y="69" fill="#a6e6ff" opacity="0.8">SSE streaming active — clients: 3</text>
    </g>

    <!-- desk base -->
    <rect x="1010" y="320" width="360" height="10" rx="5" fill="#08121a" opacity="0.9" />
  </g>

  <!-- subtle logo text -->
  <g transform="translate(60,210)">
    <text x="0" y="0" font-family="Inter, Roboto, -apple-system, sans-serif" font-size="40" fill="white" fill-opacity="0.95">Nagesh Kore</text>
    <text x="0" y="36" font-family="Inter, Roboto, -apple-system, sans-serif" font-size="16" fill="#9fb6c9">AI Engineer · Full‑Stack Systems</text>
  </g>

</svg>
