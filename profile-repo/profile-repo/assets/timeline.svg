<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering journey timeline">
  <defs>
    <linearGradient id="tlLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#080C20"/>

  <path d="M80 150 H1120" stroke="url(#tlLine)" stroke-width="3"/>

  <g font-family="Verdana, Geneva, sans-serif" text-anchor="middle">

    <!-- node 1 -->
    <circle cx="120" cy="150" r="9" fill="#5EE6FF"/>
    <text x="120" y="115" font-size="13" fill="#8FA0D6">2023</text>
    <text x="120" y="190" font-size="13" fill="#F1F5FF" font-weight="bold">SS Clinic</text>
    <text x="120" y="208" font-size="11" fill="#8FA0D6">First production</text>
    <text x="120" y="222" font-size="11" fill="#8FA0D6">client delivery</text>

    <!-- node 2 -->
    <circle cx="330" cy="150" r="9" fill="#5EE6FF"/>
    <text x="330" y="115" font-size="13" fill="#8FA0D6">2024</text>
    <text x="330" y="190" font-size="13" fill="#F1F5FF" font-weight="bold">Clinichealthtree</text>
    <text x="330" y="208" font-size="11" fill="#8FA0D6">Full-stack healthcare</text>
    <text x="330" y="222" font-size="11" fill="#8FA0D6">infrastructure</text>

    <!-- node 3 -->
    <circle cx="540" cy="150" r="9" fill="#A26BFF"/>
    <text x="540" y="115" font-size="13" fill="#8FA0D6">2024</text>
    <text x="540" y="190" font-size="13" fill="#F1F5FF" font-weight="bold">Virtual AI Mouse</text>
    <text x="540" y="208" font-size="11" fill="#8FA0D6">Published research</text>
    <text x="540" y="222" font-size="11" fill="#8FA0D6">JETIR, May 2025</text>

    <!-- node 4 -->
    <circle cx="750" cy="150" r="9" fill="#5EE6FF"/>
    <text x="750" y="115" font-size="13" fill="#8FA0D6">2025</text>
    <text x="750" y="190" font-size="13" fill="#F1F5FF" font-weight="bold">VoxFlow</text>
    <text x="750" y="208" font-size="11" fill="#8FA0D6">Voice-first agent with</text>
    <text x="750" y="222" font-size="11" fill="#8FA0D6">vector memory</text>

    <!-- node 5 -->
    <circle cx="960" cy="150" r="10" fill="#A26BFF"/>
    <text x="960" y="115" font-size="13" fill="#8FA0D6">2025</text>
    <text x="960" y="190" font-size="13" fill="#F1F5FF" font-weight="bold">FOSYS</text>
    <text x="960" y="208" font-size="11" fill="#8FA0D6">Best Paper Award</text>
    <text x="960" y="222" font-size="11" fill="#8FA0D6">IC-AISMART 2025</text>

    <!-- node 6 -->
    <circle cx="1140" cy="150" r="9" fill="#5EE6FF"/>
    <text x="1140" y="115" font-size="13" fill="#8FA0D6">Now</text>
    <text x="1140" y="190" font-size="13" fill="#F1F5FF" font-weight="bold">Enterprise RAG</text>
    <text x="1140" y="208" font-size="11" fill="#8FA0D6">+ agent memory</text>
    <text x="1140" y="222" font-size="11" fill="#8FA0D6">architectures</text>

  </g>
</svg>
