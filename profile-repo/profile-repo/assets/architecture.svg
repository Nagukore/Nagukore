<svg width="100%" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI system architecture flow: User to Response">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#151E45"/>
      <stop offset="100%" stop-color="#1B2A5C"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#22D3EE"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#080C20"/>

  <!-- connecting spine -->
  <path d="M450 78 V 562" stroke="#22D3EE" stroke-width="2" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- stage template repeated -->
  <g font-family="Verdana, Geneva, sans-serif">

    <!-- 1 User -->
    <rect x="300" y="20" width="300" height="58" rx="12" fill="url(#boxGrad)" stroke="#3A4A8C"/>
    <text x="450" y="55" font-size="17" fill="#F1F5FF" text-anchor="middle">User</text>
    <path d="M450 78 L450 108" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 2 Intent Classification -->
    <rect x="270" y="108" width="360" height="58" rx="12" fill="url(#boxGrad)" stroke="#3A4A8C"/>
    <text x="450" y="143" font-size="17" fill="#F1F5FF" text-anchor="middle">Intent Classification</text>
    <path d="M450 166 L450 196" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 3 Semantic Search -->
    <rect x="260" y="196" width="380" height="58" rx="12" fill="url(#boxGrad)" stroke="#3A4A8C"/>
    <text x="450" y="231" font-size="17" fill="#F1F5FF" text-anchor="middle">Semantic Search</text>
    <path d="M450 254 L450 284" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 4 RAG -->
    <rect x="300" y="284" width="300" height="58" rx="12" fill="url(#boxGrad)" stroke="#3A4A8C"/>
    <text x="450" y="319" font-size="17" fill="#F1F5FF" text-anchor="middle">Retrieval-Augmented Generation</text>
    <path d="M450 342 L450 372" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 5 Agent -->
    <rect x="320" y="372" width="260" height="58" rx="12" fill="url(#boxGrad)" stroke="#3A4A8C"/>
    <text x="450" y="407" font-size="17" fill="#F1F5FF" text-anchor="middle">Agent Orchestrator</text>
    <path d="M450 430 L450 460" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 6 Memory -->
    <rect x="330" y="460" width="240" height="58" rx="12" fill="url(#boxGrad)" stroke="#3A4A8C"/>
    <text x="450" y="495" font-size="17" fill="#F1F5FF" text-anchor="middle">Memory Layer (Qdrant)</text>
    <path d="M450 518 L450 548" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 7 LLM -->
    <rect x="340" y="548" width="220" height="58" rx="12" fill="url(#boxGrad)" stroke="#3A4A8C"/>
    <text x="450" y="583" font-size="17" fill="#F1F5FF" text-anchor="middle">LLM Inference</text>

    <!-- 8 Response (side branch) -->
    <path d="M560 577 L 680 577 L 680 610" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  </g>

  <!-- Response box -->
  <g font-family="Verdana, Geneva, sans-serif">
    <rect x="660" y="600" width="180" height="34" rx="10" fill="#1B2A5C" stroke="#8B5CF6"/>
    <text x="750" y="622" font-size="14" fill="#E7DBFF" text-anchor="middle">Streamed Response</text>
  </g>
</svg>
